<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Recruiter Profile</title>
</head>
<body>

    <h1>Edit Recruiter Profile</h1>

    <form method="POST">

        <label for="company_name">Company Name:</label>
        <input
            type="text"
            id="company_name"
            name="company_name"
            value="{{ recruiter_profile.company_name }}"
        >

        <label for="company_description">Company Description:</label>
        <textarea
            id="company_description"
            name="company_description"
        >{{ recruiter_profile.company_description or "" }}</textarea>

        <label for="contact_phone">Contact Phone:</label>
        <input
            type="text"
            id="contact_phone"
            name="contact_phone"
            value="{{ recruiter_profile.contact_phone or "" }}"
        >

        <button type="submit">Save Changes</button>

    </form>

</body>
</html>
