<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4f46e5">
    <title>Offline | InternMatch</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f7ff;
            color: #29245a;
            min-height: 100vh;
            display: grid;
            place-items: center;
            text-align: center;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
        }

        main {
            max-width: 420px;
        }

        h1 {
            font-size: 2rem;
        }

        p {
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 22px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <main>
        <h1>You're currently offline</h1>
        <p>
            InternMatch needs an internet connection to load your account
            and internship information.
        </p>
        <p>Please reconnect and try again.</p>
        <a href="/">Try Again</a>
    </main>
</body>
</html>
