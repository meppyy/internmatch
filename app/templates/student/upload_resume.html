<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Resume - InternMatch</title>
</head>
<body>

    <h1>Upload Resume</h1>

    <p>
        <a href="{{ url_for('student.profile') }}">Back to Profile</a>
    </p>

    {% if student.resume %}
        <p>
            Current resume:
            <strong>{{ student.resume.file_name }}</strong>
        </p>
    {% else %}
        <p>No resume uploaded yet.</p>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">

        <label for="resume">Choose Resume:</label>

        <input
            type="file"
            id="resume"
            name="resume"
            required
        >

        <br><br>

        <button type="submit">Upload Resume</button>

    </form>

</body>
</html>
