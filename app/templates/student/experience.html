<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experience & Projects - InternMatch</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    {% include "_navigation.html" %}

    <main class="page-container">

        <a class="back-link"
           href="{{ url_for('student.profile') }}">
            ← Back to Profile
        </a>

        <div class="page-heading">
            <span class="eyebrow">STUDENT PROFILE</span>
            <h1>Experience, Projects & Certifications</h1>
            <p>
                Showcase your practical experience, projects and
                professional certifications.
            </p>
        </div>

        <form method="POST"
              action="{{ url_for('student.edit_profile') }}"
              class="form-card">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <div class="form-section-heading">
                <h2>Professional Background</h2>
                <p>
                    Keep these details updated to help recruiters
                    understand your capabilities.
                </p>
            </div>

            <div class="form-group">
                <label for="experience">Experience</label>

                <textarea
                    id="experience"
                    name="experience"
                    rows="8"
                    placeholder="Describe your experience..."
                >{{ student.experience or "" }}</textarea>
            </div>

            <div class="form-group">
                <label for="projects">Projects</label>

                <textarea
                    id="projects"
                    name="projects"
                    rows="8"
                    placeholder="Describe your projects..."
                >{{ student.projects or "" }}</textarea>
            </div>

            <div class="form-group">
                <label for="certifications">Certifications</label>

                <textarea
                    id="certifications"
                    name="certifications"
                    rows="8"
                    placeholder="List your certifications..."
                >{{ student.certifications or "" }}</textarea>
            </div>

            <div class="form-actions">

                <button type="submit" class="primary-button">
                    Save Changes
                </button>

                <a href="{{ url_for('student.profile') }}"
                   class="secondary-button">
                    Cancel
                </a>

            </div>

        </form>

    </main>

</body>
</html>
