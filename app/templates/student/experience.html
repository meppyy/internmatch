<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experience & Projects - InternMatch</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="app-page">
    {% include "_navigation.html" %}

    <h1>Experience, Projects & Certifications</h1>

    <p>
        <a href="{{ url_for('student.profile') }}">Back to Profile</a>
    </p>

    <form method="POST" action="{{ url_for('student.edit_profile') }}">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <h2>Experience</h2>
        <textarea
            name="experience"
            rows="8"
            cols="60"
            placeholder="Describe your experience..."
        >{{ student.experience or "" }}</textarea>

        <h2>Projects</h2>
        <textarea
            name="projects"
            rows="8"
            cols="60"
            placeholder="Describe your projects..."
        >{{ student.projects or "" }}</textarea>

        <h2>Certifications</h2>
        <textarea
            name="certifications"
            rows="8"
            cols="60"
            placeholder="List your certifications..."
        >{{ student.certifications or "" }}</textarea>

        <br><br>

        <button type="submit">Save Changes</button>

    </form>

</body>
</html>
